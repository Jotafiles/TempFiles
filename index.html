<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TempFiles – Private File Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Consolas, monospace;
}

body {
  height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.10), rgba(0,0,0,0.85)),
    url("media/fondo.jpg");
  background-size: cover;
  background-position: center;
  color: #e0e0e0;
}

/* Ventana */
.window {
  width: 90%;
  max-width: 700px;
  margin: auto;
  margin-top: 8vh;
  background: rgba(15,15,15,0.95);
  border: 2px solid #444;
  border-radius: 8px;
  box-shadow: 0 0 40px black;
}

/* Barra */
.titlebar {
  background: #222;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
}

.controls span {
  margin-left: 8px;
  cursor: not-allowed;
}

/* Contenido */
.content {
  padding: 20px;
}

.path {
  margin-bottom: 15px;
  color: #7aff7a;
}

.file {
  display: flex;
  justify-content: space-between;
  padding: 8px 10px;
  border-bottom: 1px dashed #333;
}

.file:hover {
  background: rgba(255,255,255,0.05);
}

/* Botón */
.truth-btn {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  background: #ff0055;
  color: black;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 4px 4px 0 black;
}

/* FLASHBANG */
.flashbang {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}

.flashback {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  z-index: 15;
}

.flashback img {
  max-width: 85%;
  max-height: 85%;
  filter: grayscale(100%) contrast(1.3);
}

/* ACTIVACIÓN */
.flashbang.active {
  animation: flashbang 5.5s ease-out forwards;
}

.flashback.active {
  animation: reveal 3.5s ease forwards;
}

/* ANIMACIONES */
@keyframes flashbang {
  0%   { opacity: 0; }
  5%   { opacity: 1; }
  55%  { opacity: 1; }   /* BLANCO TOTAL */
  100% { opacity: 0; }   /* SE VA LENTO */
}

@keyframes reveal {
  0%   { opacity: 0; }
  40%  { opacity: 0.3; }
  100% { opacity: 1; }
}

</style>
</head>

<body>

<audio id="truthSound" src="media/sound.mp3"></audio>

<div class="window">
  <div class="titlebar">
    <span>TempFiles.exe — Private Manager</span>
    <div class="controls">
      <span>—</span><span>□</span><span>X</span>
    </div>
  </div>

  <div class="content">
    <div class="path">C:\TempFiles\Season_3\status\</div>

    <div class="file"><span>📁 archives</span><span>restricted</span></div>
    <div class="file"><span>📁 backups</span><span>corrupted</span></div>
    <div class="file"><span>📄 readme.txt</span><span>lies</span></div>
    <div class="file"><span>📄 season3.exe</span><span>not responding</span></div>

    <p style="margin-top:15px; opacity:0.6;">
      TempFiles está temporalmente muerto<br>
      temporada 3 en proceso chanchiswawis xd
    </p>

    <button class="truth-btn" onclick="triggerTruth()">
      💣 TRUTH NUKE (do not press)
    </button>
  </div>
</div>

<!-- Flashbang blanco -->
<div class="flashbang" id="flashbang"></div>

<!-- Imagen flashback -->
<div class="flashback" id="flashback">
  <img src="media/flashback.jpeg" alt="truth">
</div>

<script>
function triggerTruth() {
  const bang = document.getElementById("flashbang");
  const flash = document.getElementById("flashback");
  const sound = document.getElementById("truthSound");

  sound.currentTime = 0;
  sound.play();

  bang.classList.remove("active");
  flash.classList.remove("active");

  void bang.offsetWidth; // reset animación

  bang.classList.add("active");

  // la imagen aparece cuando sigues medio ciego
  setTimeout(() => {
    flash.classList.add("active");
  }, 2000);
}
</script>


</body>
</html>
